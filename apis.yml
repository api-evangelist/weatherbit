description: Weatherbit is a leading provider of weather data and forecasting services. They specialize in delivering accurate
  and up-to-date weather information to businesses and individuals around the world. Services include real-time current weather,
  16-day daily and 240-hour hourly forecasts, historical weather data, severe alerts, air quality monitoring, agricultural
  weather, energy forecasts, and climate normals. Data is available globally via lat/lon, city name, postal code, and station
  ID.
